{% extends 'base.html' %}
{% block main %}
        <form action="" method="POST" novalidate>
            {{ form.hidden_tag() }}
            <p>{{ enrollment.course.prefix }} {{ enrollment.course.number }} - {{ enrollment.course.name }}</p>
            <p>{{ form.grade.label }} <br> {{ form.grade() }}</p>
            <p>{{ form.submit() }}</p>
        </form>
{% endblock %}
