[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpacgo_lib"
version = "0.0.1"
authors = [
  { name="Faye G" },
  { name="Artemis W" },
  { name="Jess C" },
  { name="Nikki Z" },
  { name="Yasir F" },
]
description = "Grade Point Average Calculator Group One Library"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/lunarOntologist/prj-1.git"